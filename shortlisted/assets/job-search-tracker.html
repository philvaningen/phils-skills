<!-- Job Search Tracker — self-contained artifact template (v2).
     Storage is personal (shared=false) so each person who opens their own
     copy gets their own data. Two buttons (Scan Gmail, Draft nudge) call the
     Anthropic API directly with the person's connected Gmail attached.
     Only the free Gmail connector is needed for those buttons; everything
     else works without it. Backup / Import / Copy for Claude work anywhere. -->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap');
  :root {
    --bg: #f6f5f0;
    --paper: #fffdf9;
    --ink: #20241f;
    --ink-soft: #5b6058;
    --border: #e2ded2;
    --primary: #2f5d50;
    --primary-soft: #e7efea;
    --applied: #4c6b8a;
    --applied-soft: #e8eef4;
    --interview: #b5791f;
    --interview-soft: #f6ecd9;
    --offer: #2f5d50;
    --offer-soft: #e2eee8;
    --closed: #8c8579;
    --closed-soft: #ece9e2;
    --overdue: #a3432f;
    --overdue-soft: #f5e5e0;
    --radius: 10px;
    --serif: Fraunces, 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;
    --sans: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 14.5px; line-height: 1.5; }
  #app { max-width: 1080px; margin: 0 auto; padding: 28px 24px 60px; }

  header.top { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }
  h1 { font-family: var(--serif); font-weight: 500; font-size: 28px; margin: 0 0 4px; letter-spacing: -0.01em; }
  .tagline { color: var(--ink-soft); margin: 0; font-size: 13.5px; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; }

  .banner { background: var(--interview-soft); color: var(--ink); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 14px; margin-bottom: 16px; font-size: 13.5px; }

  .stats { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .stat { background: var(--paper); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 14px; min-width: 108px; }
  .stat .n { font-family: var(--serif); font-size: 22px; line-height: 1; }
  .stat .l { color: var(--ink-soft); font-size: 12px; margin-top: 3px; }
  .stat.warn .n { color: var(--overdue); }

  .upcoming { background: var(--paper); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 14px; margin-bottom: 18px; }
  .upcoming h3 { margin: 0 0 6px; font-size: 12px; font-weight: 500; color: var(--ink-soft); }
  .upcoming ul { margin: 0; padding: 0; list-style: none; }
  .upcoming li { font-size: 13.5px; padding: 3px 0; }
  .upcoming .when { display: inline-block; min-width: 92px; font-weight: 600; color: var(--interview); }

  .btn { border: none; border-radius: 7px; padding: 9px 15px; font-family: var(--sans); font-weight: 500; font-size: 13.5px; cursor: pointer; }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: #244a40; }
  .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--ink); }
  .btn-ghost:hover { background: var(--primary-soft); border-color: var(--primary); }
  .btn-danger { background: var(--overdue); color: #fff; }
  .btn-small { padding: 5px 10px; font-size: 12.5px; border-radius: 6px; }
  .btn:disabled { opacity: 0.5; cursor: default; }

  nav.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 18px; overflow-x: auto; }
  nav.tabs button { background: none; border: none; padding: 10px 4px; margin-right: 20px; font-family: var(--sans); font-size: 14px; color: var(--ink-soft); cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; }
  nav.tabs button.active { color: var(--ink); border-bottom-color: var(--primary); font-weight: 500; }

  table { width: 100%; border-collapse: collapse; background: var(--paper); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  thead th { text-align: left; font-size: 11.5px; color: var(--ink-soft); font-weight: 500; padding: 10px 12px; border-bottom: 1px solid var(--border); }
  tbody td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: #fbfaf6; }
  td input, td select, td textarea { width: 100%; border: 1px solid transparent; background: transparent; font-family: var(--sans); font-size: 13.5px; color: var(--ink); padding: 3px 5px; border-radius: 5px; }
  td input:hover, td select:hover, td textarea:hover { border-color: var(--border); }
  td input:focus, td select:focus, td textarea:focus { outline: none; border-color: var(--primary); background: #fff; }
  td input + input { margin-top: 4px; }
  textarea { resize: vertical; min-height: 30px; }
  td.rank { width: 34px; color: var(--ink-soft); font-family: var(--serif); font-size: 16px; }

  .badge { display: inline-block; padding: 3px 9px; border-radius: 20px; font-size: 12px; font-weight: 500; white-space: nowrap; }
  .badge.open { background: transparent; border: 1px dashed var(--ink-soft); color: var(--ink-soft); }
  .badge.applied { background: var(--applied-soft); color: var(--applied); }
  .badge.interview { background: var(--interview-soft); color: var(--interview); }
  .badge.offer { background: var(--offer-soft); color: var(--offer); }
  .badge.closed { background: var(--closed-soft); color: var(--closed); }
  .badge.overdue { background: var(--overdue-soft); color: var(--overdue); }
  .badge.ontrack { background: var(--offer-soft); color: var(--offer); }
  td select.status-select { width: auto; border: none; cursor: pointer; padding: 4px 10px; font-size: 12.5px; font-weight: 500; border-radius: 20px; }
  td select.status-select.open { border: 1px dashed var(--ink-soft); }

  .row-actions { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .icon-btn { background: none; border: none; color: var(--ink-soft); cursor: pointer; font-size: 15px; padding: 2px 5px; }
  .icon-btn:hover { color: var(--ink); }
  .icon-btn.remove:hover { color: var(--overdue); }
  .icon-btn:disabled { opacity: 0.3; cursor: default; }

  .add-row-btn { margin-top: 10px; }
  .empty { color: var(--ink-soft); padding: 26px 12px; text-align: center; font-size: 13.5px; }

  .panel-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  .hint { color: var(--ink-soft); font-size: 12.5px; }

  .modal-backdrop { position: fixed; inset: 0; background: rgba(32,36,31,0.45); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 50; }
  .modal { background: var(--paper); border-radius: 12px; max-width: 600px; width: 100%; max-height: 85vh; overflow: auto; padding: 22px; }
  .modal h2 { font-family: var(--serif); font-weight: 500; font-size: 19px; margin: 0 0 4px; }
  .modal p.sub { color: var(--ink-soft); font-size: 13px; margin: 0 0 14px; }
  .modal textarea.big { width: 100%; min-height: 200px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; border: 1px solid var(--border); border-radius: 8px; padding: 10px; background: #fff; color: var(--ink); }
  .modal label.field { display: block; font-size: 13px; color: var(--ink-soft); margin: 10px 0 4px; }
  .modal select { font-family: var(--sans); font-size: 13.5px; padding: 5px 8px; border: 1px solid var(--border); border-radius: 6px; background: #fff; }
  .diff-item { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; display: flex; gap: 10px; align-items: flex-start; }
  .diff-item .txt { flex: 1; font-size: 13.5px; }
  .diff-item .txt .co { font-weight: 600; }
  .diff-item .txt .ev { color: var(--ink-soft); font-size: 12.5px; margin-top: 3px; white-space: pre-wrap; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
  .warn-text { color: var(--overdue); font-size: 13px; margin-top: 10px; }
  .spinner-line { display: flex; align-items: center; gap: 8px; color: var(--ink-soft); font-size: 13.5px; padding: 6px 0; }

  .toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 8px; font-size: 13.5px; z-index: 60; max-width: calc(100% - 32px); }

  /* Phone layout: each table row becomes a card with labelled fields */
  @media (max-width: 720px) {
    #app { padding: 20px 16px 48px; }
    h1 { font-size: 24px; }
    table, tbody, tr, td { display: block; width: 100%; }
    thead { display: none; }
    table { border: none; background: transparent; }
    tbody tr { background: var(--paper); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 10px; padding: 6px 2px; }
    tbody td { border: none; padding: 4px 10px; }
    tbody td[data-label]::before { content: attr(data-label); display: block; font-size: 11.5px; color: var(--ink-soft); }
    td.rank { width: auto; }
    .stat { flex: 1 1 40%; }
  }
</style>

<div id="app"></div>

<script>
(function () {
  const KEYS = ['priorityList', 'applications', 'networking', 'agencies', 'meta'];
  const STATUSES = ['Open', 'Submitted', 'Interview', 'Offer', 'Closed'];
  const STATUS_CLASS = { Open: 'open', Submitted: 'applied', Interview: 'interview', Offer: 'offer', Closed: 'closed' };
  const TAB_LABELS = { priorityList: 'Priority List', applications: 'Applications', networking: 'Network', agencies: 'Agencies' };

  const state = {
    tab: 'applications',
    priorityList: [],
    applications: [],
    networking: [],
    agencies: [],
    meta: { lastGmailScan: null },
    loading: true,
    storageOk: true,
    modal: null,
  };

  // ---------- Dates (always local time, never UTC) ----------
  const uid = () => Math.random().toString(36).slice(2, 9);
  const pad = (n) => String(n).padStart(2, '0');
  const isoOf = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const todayISO = () => isoOf(new Date());
  const parseISO = (s) => new Date(s + 'T00:00:00');

  function addBusinessDays(dateStr, n) {
    const d = parseISO(dateStr);
    let added = 0;
    while (added < n) {
      d.setDate(d.getDate() + 1);
      const day = d.getDay();
      if (day !== 0 && day !== 6) added++;
    }
    return isoOf(d);
  }
  function daysUntil(dateStr) {
    return Math.round((parseISO(dateStr) - parseISO(todayISO())) / 86400000);
  }
  function fmtDate(s) {
    if (!s) return '';
    return parseISO(s).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
  }
  function normalizeDate(v) {
    v = (v || '').trim();
    if (!v) return '';
    if (/^\d{4}-\d{2}-\d{2}$/.test(v)) return v;
    const d = new Date(v);
    return isNaN(d) ? '' : isoOf(d);
  }
  function normalizeStatus(v, hasApplied) {
    const s = (v || '').toLowerCase();
    const exact = STATUSES.find((x) => x.toLowerCase() === s);
    if (exact) return exact;
    if (s.includes('interview') || s.includes('screen')) return 'Interview';
    if (s.includes('offer')) return 'Offer';
    if (s.includes('reject') || s.includes('closed') || s.includes('declin') || s.includes('withdr')) return 'Closed';
    if (s.includes('appl') || s.includes('submit')) return 'Submitted';
    return hasApplied ? 'Submitted' : 'Open';
  }

  // ---------- Storage ----------
  async function load() {
    if (!window.storage || typeof window.storage.get !== 'function') {
      state.storageOk = false;
    } else {
      for (const k of KEYS) {
        try {
          const r = await window.storage.get(k, false);
          if (r && r.value) state[k] = JSON.parse(r.value);
        } catch (e) { /* key not set yet, keep default */ }
      }
    }
    migrate();
    state.loading = false;
    render();
  }

  async function save(key) {
    if (!state.storageOk) return;
    try {
      await window.storage.set(key, JSON.stringify(state[key]), false);
    } catch (e) {
      toast('Could not save — try again');
    }
  }
  function saveAll() { KEYS.forEach(save); }

  // Upgrades data saved by older versions of the tracker
  function migrate() {
    ['priorityList', 'applications', 'networking', 'agencies'].forEach((k) => {
      if (!Array.isArray(state[k])) state[k] = [];
      state[k].forEach((r) => { if (!r.id) r.id = uid(); });
    });
    if (!state.meta || typeof state.meta !== 'object') state.meta = { lastGmailScan: null };
    state.applications.forEach((a) => {
      ['company', 'title', 'dateApplied', 'nextStep', 'nextDate', 'notes', 'referral'].forEach((f) => { if (a[f] === undefined) a[f] = ''; });
      if (!STATUSES.includes(a.status)) a.status = normalizeStatus(a.status, !!a.dateApplied);
    });
    state.networking.forEach((n) => {
      if (n.lastContact === undefined) {
        n.lastContact = n.dateReachedOut || '';
        if (n.followedUp) n.lastContact = todayISO();
      }
      if (n.followUps === undefined) n.followUps = n.followedUp ? 1 : 0;
      if (n.replied === undefined) n.replied = false;
      ['name', 'company', 'email', 'notes'].forEach((f) => { if (n[f] === undefined) n[f] = ''; });
      delete n.dateReachedOut;
      delete n.followedUp;
    });
    state.agencies.forEach((a) => {
      ['agency', 'recruiter', 'email', 'lastContact', 'notes'].forEach((f) => { if (a[f] === undefined) a[f] = ''; });
    });
  }

  let toastTimer = null;
  function toast(msg) {
    let t = document.getElementById('toast');
    if (!t) {
      t = document.createElement('div');
      t.id = 'toast';
      t.className = 'toast';
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.style.display = 'block';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.style.display = 'none'; }, 3200);
  }

  // ---------- Anthropic API + Gmail helper ----------
  const MCP_SERVERS = {
    gmail: { type: 'url', url: 'https://gmailmcp.googleapis.com/mcp/v1', name: 'gmail-mcp' },
  };

  async function askClaude(prompt, servers, maxTokens) {
    const body = {
      model: 'claude-sonnet-5-5',
      max_tokens: maxTokens || 1500,
      messages: [{ role: 'user', content: prompt }],
    };
    if (servers && servers.length) body.mcp_servers = servers.map((s) => MCP_SERVERS[s]);
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const data = await res.json();
    if (!res.ok || data.error) throw new Error((data.error && data.error.message) || 'Request failed');
    const text = (data.content || []).filter((b) => b.type === 'text').map((b) => b.text).join('\n');
    return { text, raw: data };
  }

  function extractJson(text) {
    const cleaned = (text || '').replace(/```json|```/g, '').trim();
    try { return JSON.parse(cleaned); } catch (e) { /* fall through */ }
    const starts = [cleaned.indexOf('['), cleaned.indexOf('{')].filter((i) => i !== -1);
    if (!starts.length) return null;
    const start = Math.min(...starts);
    const end = Math.max(cleaned.lastIndexOf(']'), cleaned.lastIndexOf('}'));
    try { return JSON.parse(cleaned.slice(start, end + 1)); } catch (e) { return null; }
  }

  // ---------- Gmail scan ----------
  function matchApplication(u) {
    const byId = state.applications.find((a) => a.id === u.id);
    if (byId) return byId;
    const co = (u.company || '').toLowerCase().trim();
    const sameCo = state.applications.filter((a) => (a.company || '').toLowerCase().trim() === co);
    if (sameCo.length === 1) return sameCo[0];
    const ti = (u.title || '').toLowerCase().trim();
    return sameCo.find((a) => ti && (a.title || '').toLowerCase().trim() === ti) || null;
  }

  async function scanGmail() {
    if (!state.applications.length) { toast('Add an application first so there’s something to match against.'); return; }
    state.modal = { type: 'loading', text: 'Searching Gmail for updates on your applications…' };
    render();
    const list = state.applications.map((a) =>
      `[id=${a.id}] ${a.company || 'unknown company'} — ${a.title || 'role unspecified'} (applied ${a.dateApplied || 'unknown'}, current status: ${a.status})`
    ).join('\n');
    const since = state.meta.lastGmailScan ? state.meta.lastGmailScan.slice(0, 10) : 'the last 90 days';
    const prompt = `Search my Gmail for messages about these job applications, sent since ${since}:\n${list}\n\n` +
      `For each application where you find an email indicating a status change (application acknowledged, moved to interview, rejected/closed, or offer), return one entry. ` +
      `If I applied to more than one role at the same company, use the role named in the email to pick the right one.\n` +
      `Respond with ONLY a JSON array, no prose, no markdown fences. Each entry: {"id": the id in square brackets for the matching application, "company": string, "title": string, "newStatus": one of "Submitted"|"Interview"|"Closed"|"Offer", "evidence": short one-sentence summary of the email, "date": the email's date in YYYY-MM-DD}.\n` +
      `If you find nothing relevant for an application, omit it. If nothing at all is found, return [].`;
    try {
      const { text } = await askClaude(prompt, ['gmail'], 2000);
      const updates = extractJson(text);
      if (!Array.isArray(updates)) throw new Error('Unreadable response');
      state.meta.lastGmailScan = new Date().toISOString();
      save('meta');
      if (!updates.length) {
        state.modal = null;
        render();
        toast('No new status updates found.');
        return;
      }
      state.modal = {
        type: 'gmail-review',
        updates: updates.map((u) => {
          const app = matchApplication(u);
          return { ...u, appId: app ? app.id : null, accept: !!app };
        }),
      };
      render();
    } catch (e) {
      state.modal = null;
      render();
      toast('Gmail scan didn’t work here — make sure Gmail is connected, or ask Claude in chat instead.');
    }
  }

  function applyGmailUpdates() {
    const accepted = state.modal.updates.filter((u) => u.accept && u.appId);
    accepted.forEach((u) => {
      const app = state.applications.find((a) => a.id === u.appId);
      if (!app) return;
      if (STATUSES.includes(u.newStatus)) app.status = u.newStatus;
      app.notes = (app.notes ? app.notes + ' — ' : '') + `${u.date || ''}: ${u.evidence || ''}`;
    });
    save('applications');
    state.modal = null;
    render();
    toast(`Updated ${accepted.length} application${accepted.length === 1 ? '' : 's'}.`);
  }

  // ---------- Network: overdue rule, nudges, replies ----------
  function isOverdue(c) {
    if (c.replied || !c.lastContact) return false;
    return todayISO() > addBusinessDays(c.lastContact, 3);
  }

  function logNudge(id) {
    const c = state.networking.find((r) => r.id === id);
    if (!c) return;
    c.followUps = (c.followUps || 0) + 1;
    c.lastContact = todayISO();
    save('networking');
    render();
    toast('Logged — the 3-day clock starts again from today.');
  }

  function toggleReplied(id) {
    const c = state.networking.find((r) => r.id === id);
    if (!c) return;
    c.replied = !c.replied;
    save('networking');
    render();
  }

  async function draftFollowUp(contact) {
    state.modal = { type: 'loading', text: `Drafting a follow-up to ${contact.name || 'your contact'}…` };
    render();
    const nth = contact.followUps ? `This would be follow-up number ${contact.followUps + 1}, so keep it extra light and easy to ignore. ` : '';
    const prompt = `Draft a short, warm, professional follow-up email to ${contact.name} at ${contact.company}${contact.email ? ` (${contact.email})` : ''}. ` +
      `Context / notes from previous contact: "${contact.notes || 'none'}". My last message to them was on ${contact.lastContact} and I haven't heard back yet. ${nth}` +
      `Keep it under 100 words, no subject line fluff, and don't be pushy — just a friendly nudge. ` +
      `Find their email thread if it exists and create a Gmail DRAFT reply (do not send it). If no prior thread exists, create a new draft addressed to them if you have or can find their email address; otherwise just return the draft text.`;
    try {
      const { text } = await askClaude(prompt, ['gmail']);
      state.modal = { type: 'draft-done', text, contact };
      render();
    } catch (e) {
      state.modal = null;
      render();
      toast('Couldn’t draft the email here — make sure Gmail is connected, or ask Claude in chat instead.');
    }
  }

  // ---------- Copy for Claude ----------
  function summaryText() {
    const L = [];
    L.push(`My job search tracker (as of ${todayISO()})`);
    L.push('');
    L.push('PRIORITY LIST (most wanted first)');
    if (!state.priorityList.length) L.push('(empty)');
    state.priorityList.forEach((p, i) => {
      L.push(`${i + 1}. ${p.company || '?'}${p.contact ? ` — advocate: ${p.contact}` : ''}${p.link ? ` — ${p.link}` : ''}`);
    });
    L.push('');
    L.push('APPLICATIONS');
    if (!state.applications.length) L.push('(empty)');
    state.applications.forEach((a) => {
      const bits = [`${a.company || '?'} — ${a.title || 'role?'}`, `status: ${a.status}`];
      if (a.dateApplied) bits.push(`applied ${a.dateApplied}`);
      if (a.nextStep || a.nextDate) bits.push(`next: ${a.nextStep || 'step'}${a.nextDate ? ` on ${a.nextDate}` : ''}`);
      if (a.referral) bits.push(`referral: ${a.referral}`);
      if (a.notes) bits.push(`notes: ${a.notes}`);
      L.push('- ' + bits.join(' | '));
    });
    L.push('');
    L.push('NETWORK (3-business-day follow-up rule)');
    if (!state.networking.length) L.push('(empty)');
    state.networking.forEach((n) => {
      const st = n.replied ? 'replied' : isOverdue(n) ? 'OVERDUE for a nudge' : 'waiting';
      const bits = [`${n.name || '?'} (${n.company || '?'})`, st];
      if (n.lastContact) bits.push(`last contact ${n.lastContact}`);
      if (n.followUps) bits.push(`nudged ${n.followUps}x`);
      if (n.notes) bits.push(`notes: ${n.notes}`);
      L.push('- ' + bits.join(' | '));
    });
    L.push('');
    L.push('RECRUITING AGENCIES');
    if (!state.agencies.length) L.push('(empty)');
    state.agencies.forEach((g) => {
      const bits = [`${g.agency || '?'}${g.recruiter ? ` — ${g.recruiter}` : ''}`];
      if (g.lastContact) bits.push(`last contact ${g.lastContact}`);
      if (g.notes) bits.push(`notes: ${g.notes}`);
      L.push('- ' + bits.join(' | '));
    });
    return L.join('\n');
  }

  async function copyText(text, textareaId) {
    try {
      await navigator.clipboard.writeText(text);
      toast('Copied.');
      return;
    } catch (e) { /* fall back below */ }
    const ta = document.getElementById(textareaId);
    if (ta) {
      ta.focus();
      ta.select();
      try { document.execCommand('copy'); toast('Copied.'); return; } catch (e) { /* ignore */ }
    }
    toast('Select the text and copy it manually.');
  }

  // ---------- Backup & import ----------
  function backupJson() {
    return JSON.stringify({
      app: 'job-search-tracker', version: 2, exportedAt: new Date().toISOString(),
      priorityList: state.priorityList, applications: state.applications,
      networking: state.networking, agencies: state.agencies, meta: state.meta,
    }, null, 2);
  }

  function downloadFile(name, text, type) {
    try {
      const url = URL.createObjectURL(new Blob([text], { type }));
      const a = document.createElement('a');
      a.href = url;
      a.download = name;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    } catch (e) {
      toast('Download isn’t allowed here — use Copy instead.');
    }
  }

  function parseDelimited(text) {
    const firstLine = text.split(/\r?\n/)[0] || '';
    const delim = firstLine.includes('\t') ? '\t' : ',';
    const rows = [];
    let row = [], cell = '', inQ = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (inQ) {
        if (ch === '"' && text[i + 1] === '"') { cell += '"'; i++; }
        else if (ch === '"') inQ = false;
        else cell += ch;
      } else if (ch === '"') inQ = true;
      else if (ch === delim) { row.push(cell); cell = ''; }
      else if (ch === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; }
      else if (ch !== '\r') cell += ch;
    }
    row.push(cell);
    rows.push(row);
    return rows.filter((r) => r.some((c) => c.trim() !== ''));
  }

  const FIELD_ALIASES = {
    priorityList: { company: ['company', 'organization', 'employer'], contact: ['contact', 'advocate', 'referral', 'who'], link: ['link', 'url', 'job posting', 'posting'] },
    applications: {
      company: ['company', 'employer', 'organization'], title: ['job title', 'title', 'role', 'position'],
      dateApplied: ['date applied', 'applied', 'application date', 'date'], status: ['status', 'stage'],
      nextStep: ['next step', 'next'], nextDate: ['next date', 'interview date', 'next step date'],
      notes: ['notes', 'note', 'comments'], referral: ['referral', 'referred by'],
    },
    networking: {
      name: ['name', 'contact', 'person'], company: ['company', 'employer', 'organization'], email: ['email', 'e-mail'],
      lastContact: ['last contact', 'date reached out', 'reached out', 'date'], notes: ['notes', 'note', 'comments'],
    },
    agencies: {
      agency: ['recruiting agency', 'agency', 'firm', 'company'], recruiter: ['recruiter', 'name', 'contact'],
      email: ['email', 'e-mail'], lastContact: ['last contact', 'date'], notes: ['notes', 'note', 'comments'],
    },
  };

  function importCsv(text, key) {
    const rows = parseDelimited(text);
    if (rows.length < 2) return { ok: false, msg: 'Need a header row plus at least one data row.' };
    const headers = rows[0].map((h) => h.trim().toLowerCase());
    const aliases = FIELD_ALIASES[key];
    const used = new Set();
    const colFor = {};
    // exact header matches first, then partial matches
    [true, false].forEach((exact) => {
      Object.entries(aliases).forEach(([field, names]) => {
        if (colFor[field] !== undefined) return;
        for (const n of names) {
          const idx = headers.findIndex((h, i) => !used.has(i) && (exact ? h === n : h.includes(n)));
          if (idx !== -1) { colFor[field] = idx; used.add(idx); return; }
        }
      });
    });
    if (!Object.keys(colFor).length) return { ok: false, msg: 'Couldn’t recognise any column names for that tab.' };
    let added = 0;
    rows.slice(1).forEach((r) => {
      const get = (f) => (colFor[f] !== undefined ? (r[colFor[f]] || '').trim() : '');
      let rec;
      if (key === 'priorityList') rec = { company: get('company'), contact: get('contact'), link: get('link') };
      if (key === 'applications') {
        const dateApplied = normalizeDate(get('dateApplied'));
        rec = { company: get('company'), title: get('title'), dateApplied, status: normalizeStatus(get('status'), !!dateApplied),
          nextStep: get('nextStep'), nextDate: normalizeDate(get('nextDate')), notes: get('notes'), referral: get('referral') };
      }
      if (key === 'networking') rec = { name: get('name'), company: get('company'), email: get('email'), lastContact: normalizeDate(get('lastContact')), notes: get('notes'), followUps: 0, replied: false };
      if (key === 'agencies') rec = { agency: get('agency'), recruiter: get('recruiter'), email: get('email'), lastContact: normalizeDate(get('lastContact')), notes: get('notes') };
      if (!Object.values(rec).some((v) => typeof v === 'string' && v)) return;
      state[key].push({ id: uid(), ...rec });
      added++;
    });
    save(key);
    return { ok: true, msg: `Added ${added} row${added === 1 ? '' : 's'} to ${TAB_LABELS[key]}.` };
  }

  function restoreBackup(data) {
    ['priorityList', 'applications', 'networking', 'agencies'].forEach((k) => {
      state[k] = Array.isArray(data[k]) ? data[k] : [];
    });
    state.meta = data.meta && typeof data.meta === 'object' ? data.meta : { lastGmailScan: null };
    migrate();
    saveAll();
  }

  function runImport() {
    const m = state.modal;
    const text = (m.text || '').trim();
    if (!text) { toast('Paste something or choose a file first.'); return; }
    if (text.startsWith('{')) {
      let data;
      try { data = JSON.parse(text); } catch (e) { toast('That backup couldn’t be read — is it complete?'); return; }
      if (!m.confirmReplace) { m.confirmReplace = true; render(); return; }
      restoreBackup(data);
      state.modal = null;
      render();
      toast('Backup restored.');
      return;
    }
    const result = importCsv(text, m.target);
    if (!result.ok) { toast(result.msg); return; }
    state.tab = m.target;
    state.modal = null;
    render();
    toast(result.msg);
  }

  // ---------- Generic table helpers ----------
  function addRow(key, blank) {
    state[key].push({ id: uid(), ...blank });
    save(key);
    render();
  }
  function updateRow(key, id, field, value, rerender) {
    const row = state[key].find((r) => r.id === id);
    if (row) { row[field] = value; save(key); }
    if (rerender) render();
  }
  function deleteRow(key, id) {
    state[key] = state[key].filter((r) => r.id !== id);
    save(key);
    render();
  }
  function moveRow(key, id, dir) {
    const arr = state[key];
    const i = arr.findIndex((r) => r.id === id);
    const j = i + dir;
    if (i < 0 || j < 0 || j >= arr.length) return;
    [arr[i], arr[j]] = [arr[j], arr[i]];
    save(key);
    render();
  }

  // ---------- Rendering ----------
  function el(tag, attrs, children) {
    const e = document.createElement(tag);
    Object.entries(attrs || {}).forEach(([k, v]) => {
      if (k === 'class') e.className = v;
      else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
      else if (v !== undefined && v !== null && v !== false) e.setAttribute(k, v);
    });
    (children || []).forEach((c) => { if (c) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return e;
  }

  function inputCell(key, row, field, opts) {
    opts = opts || {};
    const input = el(opts.textarea ? 'textarea' : 'input', {
      type: opts.textarea ? undefined : (opts.type || 'text'),
      placeholder: opts.placeholder || '',
      [opts.type === 'date' ? 'onchange' : 'oninput']: (e) => updateRow(key, row.id, field, e.target.value, opts.rerender),
    });
    input.value = row[field] || '';
    return input;
  }
  function editableCell(key, row, field, opts) {
    return el('td', {}, [inputCell(key, row, field, opts)]);
  }

  // Builds a table; each cell gets its column name as a label for the phone layout
  function buildTable(headers, rows, emptyText) {
    const tbody = el('tbody');
    if (!rows.length) {
      tbody.appendChild(el('tr', {}, [el('td', { colspan: String(headers.length), class: 'empty' }, [emptyText])]));
    } else {
      rows.forEach((cells) => {
        const tr = el('tr');
        cells.forEach((td, i) => {
          if (headers[i]) td.setAttribute('data-label', headers[i]);
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });
    }
    return el('table', {}, [el('thead', {}, [el('tr', {}, headers.map((h) => el('th', {}, [h])))]), tbody]);
  }

  function removeBtn(key, id) {
    return el('button', { class: 'icon-btn remove', title: 'Remove', 'aria-label': 'Remove', onclick: () => deleteRow(key, id) }, ['✕']);
  }

  function upcomingItems() {
    return state.applications
      .filter((a) => a.nextDate && a.status !== 'Closed')
      .map((a) => ({ a, d: daysUntil(a.nextDate) }))
      .filter((x) => x.d >= 0 && x.d <= 14)
      .sort((x, y) => x.d - y.d);
  }

  function renderHeader() {
    return el('header', { class: 'top' }, [
      el('div', {}, [
        el('h1', {}, ['Job Search']),
        el('p', { class: 'tagline' }, ['Priority list, applications, networking, and agencies — in one place.']),
      ]),
      el('div', { class: 'toolbar' }, [
        el('button', { class: 'btn btn-ghost', onclick: () => { state.modal = { type: 'copy-claude', text: summaryText() }; render(); } }, ['Copy for Claude']),
        el('button', { class: 'btn btn-ghost', onclick: () => { state.modal = { type: 'backup', text: backupJson() }; render(); } }, ['Backup']),
        el('button', { class: 'btn btn-ghost', onclick: () => { state.modal = { type: 'import', text: '', target: state.tab, confirmReplace: false }; render(); } }, ['Import']),
        el('button', { class: 'btn btn-primary', onclick: scanGmail }, ['✉ Scan Gmail for updates']),
      ]),
    ]);
  }

  function renderBanner() {
    if (state.storageOk) return null;
    return el('div', { class: 'banner' }, ['Automatic saving isn’t available where this tracker is open, so changes will be lost when you close it. Use Backup to save a copy, and Import to bring it back.']);
  }

  function renderStats() {
    const active = state.applications.filter((a) => a.status !== 'Closed').length;
    const interviews = state.applications.filter((a) => a.status === 'Interview').length;
    const overdue = state.networking.filter(isOverdue).length;
    const soon = upcomingItems().length;
    const stat = (n, l, warn) => el('div', { class: 'stat' + (warn ? ' warn' : '') }, [el('div', { class: 'n' }, [String(n)]), el('div', { class: 'l' }, [l])]);
    return el('div', { class: 'stats' }, [
      stat(active, 'Active applications'),
      stat(interviews, 'In interview stage'),
      stat(soon, 'Next steps in 14 days'),
      stat(overdue, 'Overdue follow-ups', overdue > 0),
    ]);
  }

  function renderUpcoming() {
    const items = upcomingItems();
    if (!items.length) return null;
    return el('div', { class: 'upcoming' }, [
      el('h3', {}, ['Coming up']),
      el('ul', {}, items.map(({ a, d }) => el('li', {}, [
        el('span', { class: 'when' }, [d === 0 ? 'Today' : d === 1 ? 'Tomorrow' : fmtDate(a.nextDate)]),
        `${a.company || '?'}${a.title ? ` (${a.title})` : ''} — ${a.nextStep || 'next step'}`,
      ]))),
    ]);
  }

  function renderTabs() {
    return el('nav', { class: 'tabs' }, Object.entries(TAB_LABELS).map(([key, label]) =>
      el('button', { class: state.tab === key ? 'active' : '', onclick: () => { state.tab = key; render(); } }, [label])
    ));
  }

  function renderPriority() {
    const rows = state.priorityList;
    const table = buildTable(['#', 'Company', 'Contact', 'Job posting link', ''], rows.map((r, i) => [
      el('td', { class: 'rank' }, [String(i + 1)]),
      editableCell('priorityList', r, 'company', { placeholder: 'Company' }),
      editableCell('priorityList', r, 'contact', { placeholder: 'Who can advocate for you' }),
      editableCell('priorityList', r, 'link', { placeholder: 'https://…' }),
      el('td', {}, [el('div', { class: 'row-actions' }, [
        el('button', { class: 'icon-btn', title: 'Move up', 'aria-label': 'Move up', disabled: i === 0, onclick: () => moveRow('priorityList', r.id, -1) }, ['↑']),
        el('button', { class: 'icon-btn', title: 'Move down', 'aria-label': 'Move down', disabled: i === rows.length - 1, onclick: () => moveRow('priorityList', r.id, 1) }, ['↓']),
        removeBtn('priorityList', r.id),
      ])]),
    ]), 'Rank the companies you most want to work at — and who could put in a word for you.');
    const foot = el('div', { class: 'panel-foot' }, [
      el('button', { class: 'btn btn-ghost add-row-btn', onclick: () => addRow('priorityList', { company: '', contact: '', link: '' }) }, ['+ Add company']),
      el('span', { class: 'hint' }, ['Use the arrows to reorder by priority.']),
    ]);
    return el('div', {}, [table, foot]);
  }

  function renderApplications() {
    const rows = state.applications;
    const table = buildTable(['Company', 'Job title', 'Applied', 'Status', 'Next step', 'Notes', 'Referral', ''], rows.map((r) => {
      const statusSelect = el('select', {
        class: 'status-select badge ' + (STATUS_CLASS[r.status] || 'applied'),
        'aria-label': 'Status',
        onchange: (e) => updateRow('applications', r.id, 'status', e.target.value, true),
      }, STATUSES.map((s) => el('option', { value: s }, [s])));
      statusSelect.value = r.status;
      return [
        editableCell('applications', r, 'company', { placeholder: 'Company' }),
        editableCell('applications', r, 'title', { placeholder: 'Role' }),
        editableCell('applications', r, 'dateApplied', { type: 'date' }),
        el('td', {}, [statusSelect]),
        el('td', {}, [
          inputCell('applications', r, 'nextStep', { placeholder: 'e.g. Phone screen' }),
          inputCell('applications', r, 'nextDate', { type: 'date', rerender: true }),
        ]),
        editableCell('applications', r, 'notes', { placeholder: 'Notes', textarea: true }),
        editableCell('applications', r, 'referral', { placeholder: 'Referral' }),
        el('td', {}, [removeBtn('applications', r.id)]),
      ];
    }), 'No applications yet — add your first one below.');
    const foot = el('div', { class: 'panel-foot' }, [
      el('button', { class: 'btn btn-ghost add-row-btn', onclick: () => addRow('applications', { company: '', title: '', dateApplied: todayISO(), status: 'Submitted', nextStep: '', nextDate: '', notes: '', referral: '' }) }, ['+ Add application']),
      state.meta.lastGmailScan ? el('span', { class: 'hint' }, ['Last Gmail scan: ' + new Date(state.meta.lastGmailScan).toLocaleString()]) : null,
    ]);
    return el('div', {}, [table, foot]);
  }

  function networkBadge(r) {
    if (r.replied) return el('span', { class: 'badge ontrack' }, ['Replied']);
    if (isOverdue(r)) {
      if ((r.followUps || 0) >= 2) return el('span', { class: 'badge closed' }, [`Nudged ${r.followUps}× — fine to move on`]);
      return el('span', { class: 'badge overdue' }, [r.followUps ? 'Nudge again — 3+ days' : 'Follow up — 3+ days']);
    }
    if (r.followUps) return el('span', { class: 'badge applied' }, [`Waiting — nudged ${r.followUps}×`]);
    return el('span', { class: 'badge open' }, ['Waiting']);
  }

  function renderNetworking() {
    const rows = state.networking;
    const table = buildTable(['Name', 'Company', 'Email', 'Last contact', 'Status', 'Notes', ''], rows.map((r) => {
      const overdue = isOverdue(r);
      return [
        editableCell('networking', r, 'name', { placeholder: 'Name' }),
        editableCell('networking', r, 'company', { placeholder: 'Company' }),
        editableCell('networking', r, 'email', { placeholder: 'Email (optional)' }),
        editableCell('networking', r, 'lastContact', { type: 'date', rerender: true }),
        el('td', {}, [networkBadge(r)]),
        editableCell('networking', r, 'notes', { placeholder: 'What matters to them, what you talked about…', textarea: true }),
        el('td', {}, [el('div', { class: 'row-actions' }, [
          overdue ? el('button', { class: 'btn btn-ghost btn-small', onclick: () => draftFollowUp(r) }, ['Draft nudge']) : null,
          !r.replied ? el('button', { class: 'btn btn-ghost btn-small', title: 'I sent a follow-up today', onclick: () => logNudge(r.id) }, ['Log nudge']) : null,
          el('button', { class: 'btn btn-ghost btn-small', onclick: () => toggleReplied(r.id) }, [r.replied ? 'Undo reply' : 'They replied']),
          removeBtn('networking', r.id),
        ])]),
      ];
    }), 'Log everyone you reach out to — rule of thumb: nudge after 3 business days of silence.');
    const foot = el('div', { class: 'panel-foot' }, [
      el('button', { class: 'btn btn-ghost add-row-btn', onclick: () => addRow('networking', { name: '', company: '', email: '', lastContact: todayISO(), notes: '', followUps: 0, replied: false }) }, ['+ Add contact']),
      el('span', { class: 'hint' }, ['“Log nudge” restarts the 3-day clock from today.']),
    ]);
    return el('div', {}, [table, foot]);
  }

  function renderAgencies() {
    const rows = state.agencies;
    const table = buildTable(['Recruiting agency', 'Recruiter', 'Email', 'Last contact', 'Notes', ''], rows.map((r) => [
      editableCell('agencies', r, 'agency', { placeholder: 'Agency' }),
      editableCell('agencies', r, 'recruiter', { placeholder: 'Recruiter name' }),
      editableCell('agencies', r, 'email', { placeholder: 'Email' }),
      editableCell('agencies', r, 'lastContact', { type: 'date' }),
      editableCell('agencies', r, 'notes', { placeholder: 'Roles they’re sending you, specialties…', textarea: true }),
      el('td', {}, [removeBtn('agencies', r.id)]),
    ]), 'Keep a running list of agencies and recruiters you’ve talked to.');
    const foot = el('div', { class: 'panel-foot' }, [
      el('button', { class: 'btn btn-ghost add-row-btn', onclick: () => addRow('agencies', { agency: '', recruiter: '', email: '', lastContact: todayISO(), notes: '' }) }, ['+ Add agency']),
    ]);
    return el('div', {}, [table, foot]);

  function modalShell(children) {
    return el('div', { class: 'modal-backdrop', onclick: (e) => { if (e.target === e.currentTarget && state.modal.type !== 'loading') { state.modal = null; render(); } } },
      [el('div', { class: 'modal', role: 'dialog' }, children)]);
  }
  const closeBtn = (label) => el('button', { class: 'btn btn-ghost', onclick: () => { state.modal = null; render(); } }, [label || 'Close']);

  function renderModal() {
    const m = state.modal;
    if (!m) return null;
    if (m.type === 'loading') return modalShell([el('div', { class: 'spinner-line' }, [m.text])]);

    if (m.type === 'gmail-review') {
      const items = m.updates.map((u) => {
        const app = u.appId ? state.applications.find((a) => a.id === u.appId) : null;
        return el('div', { class: 'diff-item' }, [
          el('input', { type: 'checkbox', checked: u.accept, disabled: !app, onchange: (e) => { u.accept = e.target.checked; } }),
          el('div', { class: 'txt' }, [
            el('div', { class: 'co' }, [app ? `${app.company} — ${app.title || 'role'} → ${u.newStatus}` : `${u.company || '?'} — ${u.title || '?'} → ${u.newStatus} (no matching row)`]),
            el('div', { class: 'ev' }, [`${u.date || ''}: ${u.evidence || ''}`]),
          ]),
        ]);
      });
      return modalShell([
        el('h2', {}, ['Updates found']),
        el('p', { class: 'sub' }, ['Uncheck anything that doesn’t look right before applying.']),
        ...items,
        el('div', { class: 'modal-actions' }, [closeBtn('Discard'), el('button', { class: 'btn btn-primary', onclick: applyGmailUpdates }, ['Apply to tracker'])]),
      ]);
    }

    if (m.type === 'draft-done') {
      return modalShell([
        el('h2', {}, ['Draft ready']),
        el('p', { class: 'sub' }, [`Here’s the follow-up for ${m.contact.name || 'your contact'}. If a Gmail draft was created, review it there before sending.`]),
        el('div', { class: 'diff-item' }, [el('div', { class: 'txt' }, [el('div', { class: 'ev' }, [m.text.slice(0, 1200)])])]),
        el('div', { class: 'modal-actions' }, [
          closeBtn('Not sent yet'),
          el('button', { class: 'btn btn-primary', onclick: () => { state.modal = null; logNudge(m.contact.id); } }, ['I sent it — log nudge']),
        ]),
      ]);
    }

    if (m.type === 'copy-claude') {
      return modalShell([
        el('h2', {}, ['Copy for Claude']),
        el('p', { class: 'sub' }, ['Copy this and paste it into a chat with Claude, then ask something like “What should I focus on this week?”']),
        el('textarea', { class: 'big', id: 'copy-area', readonly: 'readonly' }, [m.text]),
        el('div', { class: 'modal-actions' }, [closeBtn(), el('button', { class: 'btn btn-primary', onclick: () => copyText(m.text, 'copy-area') }, ['Copy'])]),
      ]);
    }

    if (m.type === 'backup') {
      return modalShell([
        el('h2', {}, ['Back up your tracker']),
        el('p', { class: 'sub' }, ['Your data only lives in this browser. Save this somewhere safe (a file, an email to yourself, or a note). To restore it later, use Import and paste it back in.']),
        el('textarea', { class: 'big', id: 'backup-area', readonly: 'readonly' }, [m.text]),
        el('div', { class: 'modal-actions' }, [
          closeBtn(),
          el('button', { class: 'btn btn-ghost', onclick: () => downloadFile(`job-search-backup-${todayISO()}.json`, m.text, 'application/json') }, ['Download file']),
          el('button', { class: 'btn btn-primary', onclick: () => copyText(m.text, 'backup-area') }, ['Copy']),
        ]),
      ]);
    }

    if (m.type === 'import') {
      const ta = el('textarea', { class: 'big', placeholder: 'Paste a backup, or rows copied from a spreadsheet (with the header row)…', oninput: (e) => { m.text = e.target.value; if (m.confirmReplace) { m.confirmReplace = false; render(); } } });
      ta.value = m.text;
      const file = el('input', { type: 'file', accept: '.json,.csv,.tsv,.txt', onchange: (e) => {
        const f = e.target.files && e.target.files[0];
        if (!f) return;
        const reader = new FileReader();
        reader.onload = () => { m.text = String(reader.result || ''); m.confirmReplace = false; render(); };
        reader.readAsText(f);
      } });
      const target = el('select', { onchange: (e) => { m.target = e.target.value; } },
        Object.entries(TAB_LABELS).map(([k, l]) => el('option', { value: k }, [l])));
      target.value = m.target;
      const isBackup = (m.text || '').trim().startsWith('{');
      return modalShell([
        el('h2', {}, ['Import']),
        el('p', { class: 'sub' }, ['Restore a backup, or bring in rows from a spreadsheet. For a spreadsheet, copy the cells including the header row (or save as CSV) — column names like Company, Title, Status and Date are matched automatically.']),
        ta,
        el('label', { class: 'field' }, ['Or choose a file']),
        file,
        isBackup ? null : el('label', { class: 'field' }, ['Add spreadsheet rows to']),
        isBackup ? null : target,
        m.confirmReplace ? el('div', { class: 'warn-text' }, ['Restoring a backup replaces everything currently in the tracker. Click again to confirm.']) : null,
        el('div', { class: 'modal-actions' }, [
          closeBtn('Cancel'),
          el('button', { class: 'btn ' + (m.confirmReplace ? 'btn-danger' : 'btn-primary'), onclick: runImport }, [m.confirmReplace ? 'Yes, replace everything' : 'Import']),
        ]),
      ]);
    }
    return null;
  }

  function render() {
    const app = document.getElementById('app');
    app.innerHTML = '';
    if (state.loading) { app.appendChild(el('p', {}, ['Loading…'])); return; }
    [renderHeader(), renderBanner(), renderStats(), renderUpcoming(), renderTabs()].forEach((n) => { if (n) app.appendChild(n); });
    const panel = { priorityList: renderPriority, applications: renderApplications, networking: renderNetworking, agencies: renderAgencies }[state.tab];
    app.appendChild((panel || renderApplications)());
    const modal = renderModal();
    if (modal) app.appendChild(modal);
  }

  load();
})();
</script>
